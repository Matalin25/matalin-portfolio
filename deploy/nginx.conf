# =============================================================================
# Nginx: продакшен-конфигурация для matalin-portfolio.ru
# -----------------------------------------------------------------------------
# Файл подключается внутри блока http {} (например, /etc/nginx/conf.d/).
# 1. SSL-сертификат (Let's Encrypt):
#      certbot --nginx -d matalin-portfolio.ru -d www.matalin-portfolio.ru
# 2. HTTP -> HTTPS и www -> без www (301).
# 3. Заголовки безопасности дублируются на уровне приложения — так надёжнее.
# =============================================================================

# Зона лимитирования объявляется один раз на уровне http {}
limit_req_zone $binary_remote_addr zone=mp_req:10m rate=10r/s;

# --- HTTP: ACME + редиректы на HTTPS ----------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name www.matalin-portfolio.ru matalin-portfolio.ru;

    # ACME-челлендж для Let's Encrypt не должен редиректиться
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        allow all;
    }

    location / {
        return 301 https://matalin-portfolio.ru$request_uri;
    }
}

# --- HTTPS: www -> без www (301) --------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.matalin-portfolio.ru;

    ssl_certificate     /etc/letsencrypt/live/matalin-portfolio.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/matalin-portfolio.ru/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    return 301 https://matalin-portfolio.ru$request_uri;
}

# --- Основной сервер (HTTPS) ------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name matalin-portfolio.ru;

    ssl_certificate     /etc/letsencrypt/live/matalin-portfolio.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/matalin-portfolio.ru/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout 5s;

    # --- Заголовки безопасности (CSP отдаёт приложение) -------------------
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "accelerometer=(), autoplay=(), camera=(), geolocation=(), microphone=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    # --- Сжатие -----------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml image/svg+xml;

    # Бинарные форматы уже сжаты — не трогаем
    gzip_disable "msie6";

    # --- Лимиты и таймауты ------------------------------------------------
    client_max_body_size 64k;
    client_body_timeout 15s;
    client_header_timeout 15s;
    keepalive_timeout 30s;
    send_timeout 20s;

    # --- Кэширование статики ---------------------------------------------
    location /static/ {
        root /srv/matalin-portfolio/app;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
    }

    # --- Приложение -------------------------------------------------------
    location / {
        limit_req zone=mp_req burst=20 nodelay;

        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_http_version 1.1;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_hide_header X-Powered-By;
    }

    # --- Мониторинг -------------------------------------------------------
    location = /health {
        access_log off;
        proxy_pass http://127.0.0.1:8000/health;
    }

    # Логи запросов и ошибок (мониторинг 4xx/5xx)
    access_log /var/log/nginx/matalin-portfolio.access.log;
    error_log  /var/log/nginx/matalin-portfolio.error.log warn;
}
